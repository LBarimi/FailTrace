<svg xmlns="http://www.w3.org/2000/svg" width="960" height="438" viewBox="0 0 960 438" role="img" aria-labelledby="title description">
<title id="title">FailTrace: reproduce, minimize, replay</title>
<desc id="description">A real guided demo recorded 7 passing and 3 failing trials, reduced 6 JSON elements to [&quot;BUG&quot;], and created a replayable bundle.</desc>
<rect width="960" height="438" rx="18" fill="#0c1523"/>
<path d="M18 0H942Q960 0 960 18V52H0V18Q0 0 18 0" fill="#182538"/>
<circle cx="26" cy="26" r="6" fill="#ff6f72"/><circle cx="48" cy="26" r="6" fill="#edc26c"/><circle cx="70" cy="26" r="6" fill="#66d2a0"/>
<g font-family="'Cascadia Code', 'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">
<text x="96" y="32" fill="#8fa5bf" font-size="14">FailTrace — local debugging evidence</text>
<text x="34" y="92" fill="#f1f6fc" font-size="23">$ failtrace demo</text>
<text x="34" y="141" fill="#81b4ff" font-size="16">01  REPRODUCE</text>
<text x="70" y="176" fill="#d8e4f3" font-size="18">7 passed   3 failed   30.0% observed failure rate</text>
<text x="34" y="225" fill="#81b4ff" font-size="16">02  MINIMIZE</text>
<text x="70" y="260" fill="#d8e4f3" font-size="18">6 JSON elements  →  [&quot;BUG&quot;]   final failure verified</text>
<text x="34" y="309" fill="#81b4ff" font-size="16">03  SHARE A REPRODUCTION</text>
<text x="70" y="344" fill="#d8e4f3" font-size="18">Bundle created: source + input + logs + replay scripts</text>
<text x="34" y="402" fill="#8fa5bf" font-size="14">Actual demo results. Full evidence: .failtrace/demos/&lt;id&gt;/</text>
</g></svg>
