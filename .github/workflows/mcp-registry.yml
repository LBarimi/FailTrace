name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version already published to npm, without v (for example 0.3.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISHER_DIRECTORY: ${{ runner.temp }}/mcp-publisher
      PUBLISHER_VERSION: v1.8.1
      # Official v1.8.1 checksums and GitHub release asset digest agree.
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify main, six-job CI, committed metadata and public npm package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          assert(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(version), 'Supply an exact package version');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Dispatch this workflow from main');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 30_000 }).trim();
          const commit = git('rev-parse', 'HEAD');
          assert.equal(commit, process.env.GITHUB_SHA);
          assert.equal(commit, git('rev-parse', 'origin/main'), 'Checkout must match origin/main');
          assert.equal(commit, git('ls-remote', '--exit-code', 'origin', 'refs/heads/main').split(/\s+/)[0], 'main moved; dispatch again');
          const manifest = JSON.parse(git('show', 'HEAD:package.json'));
          const server = JSON.parse(git('show', 'HEAD:server.json'));
          assert.deepEqual(JSON.parse(readFileSync('package.json', 'utf8')), manifest);
          assert.deepEqual(JSON.parse(readFileSync('server.json', 'utf8')), server);
          assert.equal(manifest.name, 'failtrace');
          assert.equal(manifest.version, version, 'Input version must match package.json');
          assert.equal(server.version, version, 'server.json must use the published package version');
          assert.equal(typeof manifest.mcpName, 'string', 'package.json must declare mcpName');
          assert.equal(server.name, manifest.mcpName, 'MCP names must match exactly');
          assert.equal(server.name.toLowerCase(), `io.github.${process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()}/failtrace`);
          assert.equal(server.packages?.length, 1, 'Expected one npm stdio package');
          const packaged = server.packages[0];
          assert.equal(packaged.registryType, 'npm');
          assert.equal(packaged.identifier, manifest.name);
          assert.equal(packaged.version, version);
          assert.equal(packaged.transport?.type, 'stdio');
          assert.equal((packaged.registryBaseUrl ?? 'https://registry.npmjs.org').replace(/\/$/, ''), 'https://registry.npmjs.org');
          assert.equal(server.remotes?.length ?? 0, 0, 'This server uses local stdio');
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8', timeout: 30_000, maxBuffer: 8 * 1024 * 1024 }));
          const repo = process.env.GITHUB_REPOSITORY;
          const runs = api(`/repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${commit}&event=push&per_page=100`).workflow_runs;
          const run = runs.find((item) => item.head_sha === commit && item.head_branch === 'main');
          assert(run?.status === 'completed' && run.conclusion === 'success', 'Wait for successful CI on this exact main commit, then dispatch again');
          const jobs = api(`/repos/${repo}/actions/runs/${run.id}/jobs?per_page=100`).jobs;
          for (const os of ['ubuntu-latest', 'windows-latest', 'macos-latest']) {
            for (const node of [22, 24]) {
              assert(jobs.some((job) => job.name === `check (${os}, ${node})` && job.conclusion === 'success'), `Missing successful CI job: ${os}, Node ${node}`);
            }
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${encodeURIComponent(version)}`, { signal: AbortSignal.timeout(30_000) });
          assert.equal(response.status, 200, 'Publish this exact package version to the public npm registry first');
          const published = await response.json();
          assert.equal(published.name, manifest.name);
          assert.equal(published.version, version);
          assert.equal(published.mcpName, server.name, 'Public npm package must declare the committed MCP name');
          console.log(`Verified ${server.name}@${version}, main ${commit}, CI run ${run.id}, and public npm metadata.`);
          NODE
      - name: Install the pinned official MCP publisher
        run: |
          mkdir -p "$PUBLISHER_DIRECTORY"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 --retry 2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "$PUBLISHER_DIRECTORY/mcp-publisher.tar.gz"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$PUBLISHER_DIRECTORY/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$PUBLISHER_DIRECTORY/mcp-publisher.tar.gz" -C "$PUBLISHER_DIRECTORY" mcp-publisher
          chmod +x "$PUBLISHER_DIRECTORY/mcp-publisher"
          "$PUBLISHER_DIRECTORY/mcp-publisher" --version
      - name: Validate server metadata before authentication
        run: timeout 90 "$PUBLISHER_DIRECTORY/mcp-publisher" validate server.json
      - name: Authenticate to the official registry with GitHub OIDC
        run: timeout 90 "$PUBLISHER_DIRECTORY/mcp-publisher" login github-oidc --registry=https://registry.modelcontextprotocol.io
      - name: Publish the validated server metadata
        run: timeout 120 "$PUBLISHER_DIRECTORY/mcp-publisher" publish server.json
      - name: Record the publication
        run: |
          printf 'Published FailTrace %s to the official MCP Registry from commit `%s`.\n\nThe npm package was already public; this workflow published only its MCP metadata.\n' "$RELEASE_VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
