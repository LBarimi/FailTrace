name: Performance

on:
  pull_request:
    paths: ['src/core/**', 'scripts/bench*', 'scripts/bench/**', '.github/workflows/performance.yml', 'package-lock.json']
  push:
    branches: [main]
    paths: ['src/core/**', 'scripts/bench*', 'scripts/bench/**', '.github/workflows/performance.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/bench.mjs --suite ci --check --output .failtrace/benchmarks/ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: |
            .failtrace/benchmarks/ci/report.json
            .failtrace/benchmarks/ci/report.md
          if-no-files-found: ignore
