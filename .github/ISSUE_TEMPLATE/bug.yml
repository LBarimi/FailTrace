name: Bug report
description: Report incorrect investigation behavior, installation failures, or missing evidence.
title: "Bug: "
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Node.js version, FailTrace version, and agent/client if used"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the exact command or MCP arguments and a minimal fixture. Remove private data and secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include the predicate, exit code, and relevant status fields. Target command failure alone is an expected outcome.
    validations:
      required: true
